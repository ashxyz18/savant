# Nginx reverse proxy for the SAVANT backend on EC2.
# Replace api.yourdomain.com with your subdomain, then:
#   sudo cp this-file /etc/nginx/sites-available/savant-api
#   sudo ln -s /etc/nginx/sites-available/savant-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then: sudo certbot --nginx -d api.yourdomain.com   (adds 443 + redirect)

server {
    listen 80;
    server_name api.yourdomain.com;

    # Let Certbot/ACME work
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_break $http_upgrade;
    }
}

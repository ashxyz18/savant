# Nginx for the EASIEST setup: one EC2 serves the static frontend AND proxies
# /api and /uploads to the Node backend. No S3/CloudFront needed.
#
# Replace www.example.com / example.com with your domain, then:
#   sudo cp this-file /etc/nginx/sites-available/savant
#   sudo ln -sfn /etc/nginx/sites-available/savant /etc/nginx/sites-enabled/savant
#   sudo nginx -t && sudo systemctl reload nginx
# Then: sudo certbot --nginx -d www.example.com -d example.com

server {
    listen 80;
    server_name www.example.com example.com;

    # Let Certbot/ACME work
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Backend API
    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_break $http_upgrade;
    }

    # Uploaded product images (served by the backend's /uploads route)
    location /uploads {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static frontend (Next.js export) with SPA fallback
    location / {
        root /var/www/savant;
        try_files $uri $uri/ /index.html;
    }
}

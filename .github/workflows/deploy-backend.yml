name: Deploy backend to Elastic Beanstalk

# Deploys the backend to your existing Elastic Beanstalk environment on every
# push to master that touches backend/ or this workflow.
on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package backend for Elastic Beanstalk
        working-directory: backend
        run: zip -r ../backend-deploy.zip . -x 'node_modules/*' -x '.git/*' -x '*.env' -x 'uploads/*' -x 'data/*'

      - name: Deploy to Elastic Beanstalk
        uses: einaregil/elastic-beanstalk-deploy@v1
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ secrets.AWS_REGION }}
          application_name: ${{ secrets.EB_APP_NAME }}
          environment_name: ${{ secrets.EB_ENV_NAME }}
          version_label: ${{ github.sha }}
          version_description: ${{ github.sha }}
          deployment_package: backend-deploy.zip
